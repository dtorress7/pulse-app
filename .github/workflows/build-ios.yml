name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Comprobar el modelo de fases (Swift = Python)
        run: |
          swiftc -O PulseApp/Core/SleepModel.swift Tests/main.swift -o sleepcheck
          ./sleepcheck Tests/sleep_ref.json PulseApp/Resources/sleep_model.json

      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild -project PulseApp.xcodeproj -scheme PulseApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 > errs.txt || true
          # Cada aviso agrupa 4 errores (GitHub enseña como mucho 10 avisos por paso)
          awk '{ m = m $0 "%0A" } NR % 4 == 0 { print "::error::" m; m = "" } END { if (m != "") print "::error::" m }' errs.txt

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PulseApp.app Payload/
          zip -qry PulseApp.ipa Payload
          ls -la PulseApp.ipa

      - name: Subir .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PulseApp-ipa
          path: ios/PulseApp.ipa

      - name: Subir registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
